<a class="back-link" href="/settings/devices">← Back to devices</a><header class="flow-heading"><h1>Add a device</h1><p>Choose where you want to use Catch. We’ll show only the steps you need.</p></header><check if="{{ @error }}"><p class="form-error" role="alert">{{ @error }}</p></check>
<form class="device-wizard" method="post" action="/devices" data-device-wizard><input type="hidden" name="_csrf" value="{{ @csrf }}"><fieldset><legend>What do you want to connect?</legend><div class="choice-grid"><label class="choice-option"><input type="radio" name="kind" value="mobile" required><span class="choice-icon choice-icon-mobile" aria-hidden="true"></span><strong>Mobile</strong><small>iPhone, iPad, and Android later</small></label><label class="choice-option choice-option-disabled"><input type="radio" name="kind" value="desktop" disabled><span class="choice-icon choice-icon-desktop" aria-hidden="true"></span><strong>Desktop browser</strong><small>Chrome and Firefox · coming soon</small></label></div></fieldset><fieldset data-platform-step hidden><legend>Which platform?</legend><div class="choice-grid"><label class="choice-option"><input type="radio" name="platform" value="ios" required><span class="choice-icon" aria-hidden="true">iOS</span><strong>iPhone</strong><small>Using Apple Shortcuts</small></label><label class="choice-option"><input type="radio" name="platform" value="ipados" required><span class="choice-icon" aria-hidden="true">iPad</span><strong>iPad</strong><small>Using Apple Shortcuts</small></label><label class="choice-option choice-option-disabled"><input type="radio" name="platform" value="android" disabled><span class="choice-icon" aria-hidden="true">A</span><strong>Android</strong><small>Coming soon</small></label></div></fieldset><fieldset data-name-step hidden><legend>What is this device called?</legend><label class="device-name-field">Device name<input name="name" maxlength="120" required placeholder="e.g. My iPhone"></label><div class="wizard-actions"><button class="button button-primary" type="submit">Create device</button></div></fieldset></form>
