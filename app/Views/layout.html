<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <meta name="description" content="Catch is your personal capture inbox.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="https://glyph.sorkos.net/cdn/fonts/a588550d09ff860a08cf6a3dceac2747.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=4">
  <link rel="stylesheet" href="/assets/css/components.css?v=4">
  <link rel="stylesheet" href="/assets/css/auth.css?v=2">
  <link rel="stylesheet" href="/assets/css/devices.css?v=10">
  <link rel="stylesheet" href="/assets/css/device-detail.css?v=6">
  <link rel="stylesheet" href="/assets/css/device-provenance.css?v=1">
  <link rel="stylesheet" href="/assets/css/capture-detail.css?v=12">
  <link rel="stylesheet" href="/assets/css/capture-collection.css?v=5">
  <link rel="stylesheet" href="/assets/css/capture-bulk.css?v=2">
  <link rel="stylesheet" href="/assets/css/tags.css?v=1">
  <link rel="stylesheet" href="/assets/css/lists.css?v=2">
  <link rel="stylesheet" href="/assets/css/pair.css?v=1">
  <link rel="stylesheet" href="/assets/css/coming-soon.css?v=2">
  <link rel="stylesheet" href="/assets/css/shell.css?v=3">
  <link rel="stylesheet" href="/assets/css/account.css?v=2">
  <link rel="stylesheet" href="/assets/css/layout-compat.css?v=1">
  <script>
    try {
      const t = localStorage.getItem('catch-theme');
      if (t && t !== 'system') document.documentElement.dataset.theme = t
    } catch (e) {}

  </script>
  <title>{{ @title }} | Catch</title>
</head>
<body<check if="{{ @isComingSoon }}"> class="coming-soon-page"</check>> <div class="site-shell"><a class="skip-link"
      href="#content">Skip to content</a>
    <check if="{{ @isAuthenticated && !@isComingSoon }}">
      <header class="app-header">
        <a class="brand brand-nav" href="/inbox" aria-label="Catch Inbox"><img
            src="/assets/logo/landscape_dark_small.png" alt="Catch" width="104" height="37"></a>
        <nav aria-label="Main navigation"><a href="/inbox" <check if="{{ @currentPath=='/inbox' }}"> aria-current="page"
    </check>>Inbox</a><a href="/tags" <check if="{{ str_starts_with(@currentPath,'/tags') }}"> aria-current="page"
      </check>>Tags</a><a href="/lists" <check if="{{ str_starts_with(@currentPath,'/lists') }}"> aria-current="page"
      </check>>Lists</a><a href="/help" <check if="{{ @currentPath=='/help' }}"> aria-current="page"</check>>Help</a>
    </nav>
    <div class="header-actions">
      <div class="user-menu" data-user-menu><button class="user-avatar-button" type="button" aria-expanded="false"
          aria-haspopup="menu" aria-controls="user-menu-panel" data-user-menu-trigger>
          <check if="{{ @avatarUrl }}">
            <true><img src="{{ @avatarUrl }}" alt=""></true>
            <false><span aria-hidden="true">{{ @avatarInitial }}</span></false>
          </check><span class="sr-only">Open account menu for {{ @displayName }}</span>
        </button>
        <div class="user-menu-panel" id="user-menu-panel" role="menu" data-user-menu-panel hidden>
          <div class="user-menu-identity"><strong>{{ @displayName }}</strong>
            <check if="{{ @user.email }}"><small>{{ @user.email }}</small></check>
          </div><a href="/profile" role="menuitem">Profile</a><a href="/settings" role="menuitem">Settings</a><button
            type="button" role="menuitem" data-reload-app>Refresh</button>
          <hr>
          <form method="post" action="/logout" role="none"><input type="hidden" name="_csrf"
              value="{{ @layoutCsrf }}"><button type="submit" role="menuitem">Log out</button></form>
        </div>
      </div>
    </div>
    </header>
    </check>
    <main id="content" class="{{ @isAuthenticated && !@isComingSoon ? 'app-main' : 'guest-main' }}">
      <include href="{{ @content }}" />
    </main>
  </div>
  <footer class="site-footer<check if=" {{ @isComingSoon }}"> site-footer-coming-soon</check>"><span>&copy; {{ @year }}
      by <a href="https://sorkos.net" rel="external">sorkos.net</a></span>
    <check if="{{ @isComingSoon && !@isAuthenticated && @configured }}"><a class="footer-login" href="/auth/start">Log
        in</a></check>
    <check if="{{ @isComingSoon && @isAuthenticated }}"><a class="footer-login" href="/inbox">Open Catch</a></check>
  </footer>
  <section class="toast-region" data-toast-region aria-label="Notifications" aria-live="polite">
    <repeat group="{{ @flashMessages }}" value="{{ @flash }}">
      <div class="toast toast-{{ @flash.type }}" data-toast data-auto-dismiss="5000"
        role="{{ @flash.type=='error' ? 'alert' : 'status' }}"><span>{{ @flash.message }}</span><button type="button"
          data-toast-dismiss>Dismiss</button></div>
    </repeat>
    <div class="toast toast-neutral" data-sync-status data-toast role="status" hidden><span
        data-toast-message></span><button type="button" data-toast-dismiss>Dismiss</button></div>
  </section>
  <div class="request-progress" data-request-progress role="progressbar" aria-label="Saving changes" hidden></div>
  <include if="{{ @enableCaptureActionMenu }}" href="captures/_action_menu.html" />
  <include if="{{ @enableListDialog }}" href="captures/_list_dialog.html" />
  <include if="{{ @enableTagDialog }}" href="captures/_tag_dialog.html" />
  <script type="module" src="/assets/js/app.js?v=37"></script>
  </body>

</html>
