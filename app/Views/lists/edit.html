<a class="back-link" href="/lists">&larr; All lists</a>
<header class="page-heading">
  <div>
    <h1>Edit list</h1>
    <p>Rename this list. Its captures stay assigned.</p>
  </div>
</header>
<section class="list-edit">
  <form class="inline-form" method="post" action="/lists/{{ rawurlencode(@list.id.'-'.@list.slug) }}/edit"><input
      type="hidden" name="_csrf" value="{{ @csrf }}"><label>Title<input name="title" maxlength="160" required
        value="{{ @list.title }}"></label><button class="button button-primary">Save</button></form>
</section>
