<header class="page-heading"><div><h1>Tags</h1><p>Organize captures across your inbox.</p></div></header><section class="tag-create"><form class="inline-form" method="post" action="/tags"><input type="hidden" name="_csrf" value="{{ @csrf }}"><label>New tag<input name="name" maxlength="100" required autocomplete="off" placeholder="Research"></label><button class="button button-primary">Create tag</button></form></section><section class="tag-list" aria-label="Tags"><check if="{{ !@tags }}"><div class="empty-state"><h2>No tags yet</h2><p>Create one to start grouping related captures.</p></div></check><repeat group="{{ @tags }}" value="{{ @tag }}"><article class="tag-row"><div><a href="{{ @tag.url }}"><strong>{{ @tag.name }}</strong></a><span>{{ (int)@tag.capture_count }} {{ (int)@tag.capture_count===1 ? 'capture' : 'captures' }}</span></div><div class="tag-actions"><a class="button button-secondary" href="/tags/{{ rawurlencode(@tag.id.'-'.@tag.slug) }}/edit">Edit</a><form method="post" action="/tags/{{ rawurlencode(@tag.id.'-'.@tag.slug) }}/delete" onsubmit="return confirm('Delete this tag? Captures will be kept.')"><input type="hidden" name="_csrf" value="{{ @csrf }}"><button class="button button-danger-outline">Delete</button></form></div></article></repeat></section>
