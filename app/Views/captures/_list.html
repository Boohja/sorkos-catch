<check if="{{ @captureShowViewToggle }}"><div class="capture-view-switch" role="group" aria-label="Capture layout" data-capture-view-switch<check if="{{ !@captures }}"> hidden</check>><button type="button" data-capture-view="list" aria-label="List view" aria-pressed="true"><i class="glyph glyph-table" aria-hidden="true"></i></button><button type="button" data-capture-view="grid" aria-label="Grid view" aria-pressed="false"><i class="glyph glyph-grid" aria-hidden="true"></i></button></div></check>
<section class="capture-collection capture-collection-{{ @captureCollectionVariant }}" aria-label="Captures" data-capture-list data-capture-collection data-csrf="{{ @csrf }}" data-collection-status="{{ @status }}" data-collection-list-id="{{ @collectionListId }}" data-empty-title="{{ @captureEmptyTitle }}" data-empty-text="{{ @captureEmptyText }}" data-view="list"><check if="{{ !@captures }}"><div class="empty-state"><h2>{{ @captureEmptyTitle }}</h2><p>{{ @captureEmptyText }}</p></div></check><repeat group="{{ @captures }}" value="{{ @capture }}"><include href="captures/_item.html" /></repeat></section>
