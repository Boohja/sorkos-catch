<div class="link-preview"><a class="link-preview-image" href="{{ @capture.url }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ @linkPreview.ariaTitle }}"><img src="{{ @previewAttachment.viewUrl }}" alt="" width="{{ (int)(@previewAttachment.width?:800) }}" height="{{ (int)(@previewAttachment.height?:450) }}"></a><div class="link-preview-copy"><check if="{{ @linkPreview.hasByline }}"><p class="link-preview-byline">{{ @linkPreview.provider }}<check if="{{ @linkPreview.provider && @linkPreview.author }}"><span aria-hidden="true">&middot;</span></check>{{ @linkPreview.author }}</p></check><a class="link-preview-title" href="{{ @capture.url }}" target="_blank" rel="noopener noreferrer" data-url-fallback>{{ @linkPreview.title }}</a><check if="{{ @linkPreview.description }}"><p class="link-preview-description">{{ @linkPreview.description }}</p></check><small class="editable-url<check if="{{ !@isTrashed }}"> capture-editable</check>" data-capture-field="url" data-single-line data-placeholder="Add URL" role="textbox" aria-label="Capture URL"<check if="{{ !@isTrashed }}"> contenteditable="true"</check>>{{ @capture.url }}</small></div><a class="url-card-open" data-open-capture-url href="{{ @capture.url }}" target="_blank" rel="noopener noreferrer" aria-label="Open captured URL"><i class="glyph glyph-link" aria-hidden="true"></i></a></div>
