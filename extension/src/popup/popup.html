<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header><picture><source media="(prefers-color-scheme: dark)" srcset="../assets/logo-landscape-dark.png"><img src="../assets/logo-landscape-light.png" alt="Catch" width="356" height="120"></picture><div class="header-links"><button class="setup-link" type="button" data-activity>Activity</button><button class="setup-link" type="button" data-setup>Setup</button></div></header>
    <form data-capture-form>
      <label class="sr-only" for="capture-text">Capture text</label>
      <textarea id="capture-text" maxlength="100000" required placeholder="What do you want to catch?" data-capture-text></textarea>
      <div class="source-row"><span data-source>Current page</span><span data-selection-note hidden>Formatted selection</span></div>
      <label class="screenshot-option"><input type="checkbox" data-screenshot><span>Include visible screenshot</span></label>
      <p class="status" role="status" aria-live="polite" data-status></p>
      <button class="catch-button" type="submit" data-submit>Catch</button>
    </form>
  </main>
  <script src="../shared/browser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
