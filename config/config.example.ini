[app]
env = production
debug = false
url = "https://catch.example.com"
key = "replace-with-at-least-32-random-characters"
timezone = "Europe/Berlin"

[access]
prerelease = false
allowed_sorkos_user_id = ""

[database]
driver = mysql
host = "127.0.0.1"
port = 3306
name = catch
user = catch
password = ""
charset = utf8mb4

[session]
secure = true

[uploads]
max_bytes = 15728640
allowed_mime = "image/jpeg,image/png,image/webp,application/pdf,text/plain,audio/mpeg,audio/mp4,audio/m4a,audio/x-m4a,audio/aac,audio/x-aac,audio/wav,audio/x-wav,audio/vnd.wave,audio/x-caf,audio/ogg,audio/webm,audio/flac,audio/x-flac"

[sorkos]
base_url = "https://auth.example.com"
client_id = ""
client_secret = ""
redirect_uri = "https://catch.example.com/auth/callback"
post_logout_redirect_uri = "https://catch.example.com/login"
scope = "profile email"
language = "en"
tls_verify = true

[mail]
host = "imap.example.com"
port = 993
security = "ssl"
validate_cert = true
username = ""
password = ""
imap_folder = "Catches"
imap_processed_folder = "Catches/Processed"
imap_failed_folder = "Catches/Failed"
address_domain = "catch.sorkos.net"
max_bytes = 5242880
